name: Benchmarks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/benchmark.yml"
      - "ci/scripts/bench.sh"
      - "ci/scripts/bench_shard.sh"
      - "ci/scripts/bench_adapt.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Compute benchmark shards
        id: shards
        run: echo "matrix=$(bash ci/scripts/bench_shard.sh 6)" >> "$GITHUB_OUTPUT"
  benchmark:
    needs: setup
    runs-on: ubuntu-latest
    # Shards run under a 90m watchdog (--timeout below); the slowest
    # (./arrow/array) takes ~40m. This cap sits 10m above the watchdog so the
    # watchdog trips first and names the stuck benchmark, ~4x sooner than the
    # 6h GitHub default, while leaving room for checkout, setup and upload.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Install Go for Benchmarks
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
          check-latest: false
      - name: Set up Python for benchmark metadata
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - name: Run benchmark shard ${{ matrix.id }}
        run: |
          bash ci/scripts/bench.sh "$(pwd)" --run \
            --packages "${{ matrix.packages }}" \
            --out "bench_stat_${{ matrix.id }}.dat" \
            --timeout 90m
      - name: Install benchmark metadata collector
        run: python3 -m pip install benchadapt@git+https://github.com/conbench/conbench.git@3af4a55206ad3918762cc8dd7d3012eadbe96a54#subdirectory=benchadapt/python
      - name: Capture benchmark machine information
        env:
          CONBENCH_MACHINE_INFO_NAME: amd64-debian-12
        run: python3 ci/scripts/bench_adapt.py --capture-machine-info "bench_stat_${{ matrix.id }}.dat"
      - name: Upload shard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-dat-${{ matrix.id }}
          path: |
            bench_stat_${{ matrix.id }}.dat
            bench_stat_${{ matrix.id }}.dat.machine.json
          if-no-files-found: error
          retention-days: 1
  combine:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Go for Benchmarks
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
          check-latest: false
      - name: Download shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-dat-*
          path: bench-dat
          merge-multiple: true
      - name: Combine shard results
        run: bash ci/scripts/bench.sh "$(pwd)" --aggregate --dat "bench-dat/bench_stat_*.dat" --json-out bench_stats.json
      - name: Upload combined results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-stats-json
          path: bench_stats.json
      - name: Set up Python
        if: github.event_name == 'push' && github.repository == 'apache/arrow-go' && github.ref_name == 'main'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - name: Upload results
        if: github.event_name == 'push' && github.repository == 'apache/arrow-go' && github.ref_name == 'main'
        env:
          CONBENCH_URL: https://conbench.arrow-dev.org
          CONBENCH_EMAIL: ${{ secrets.CONBENCH_EMAIL }}
          CONBENCH_PASSWORD: ${{ secrets.CONBENCH_PASS }}
          CONBENCH_REF: ${{ github.ref_name }}
          CONBENCH_MACHINE_INFO_NAME: amd64-debian-12
        run: |
          python3 -m pip install benchadapt@git+https://github.com/conbench/conbench.git@3af4a55206ad3918762cc8dd7d3012eadbe96a54#subdirectory=benchadapt/python
          python3 ci/scripts/bench_adapt.py --results bench_stats.json --machine-info-dir bench-dat
