name: Temporary Arrow 1348 codegen

on:
  push:
    branches:
      - perf/compute-get-take-indices-avx2

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-codegen]') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/compute-get-take-indices-avx2
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Install assembly generators
        run: |
          go install github.com/minio/asm2plan9s@latest
          go install github.com/minio/c2goasm@latest
          go install github.com/klauspost/asmfmt/cmd/asmfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate take-index assembly
        run: |
          clang++ --version
          make -C arrow/compute/internal/kernels -B CXX=clang++ \
            _lib/get_take_indices_avx2_amd64.s \
            get_take_indices_avx2_amd64.s
          if grep -En '\\b(rbp|ebp|bpl)\\b' arrow/compute/internal/kernels/get_take_indices_avx2_amd64.s; then
            echo "generated Go assembly still touches BP" >&2
            exit 1
          fi
          go vet -framepointer ./arrow/compute/internal/kernels
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            arrow/compute/internal/kernels/_lib/get_take_indices_avx2_amd64.s \
            arrow/compute/internal/kernels/get_take_indices_avx2_amd64.s
          if ! git diff --cached --quiet; then
            git commit -m "temp: regenerate take-index assembly [skip-codegen]"
            git push origin HEAD:perf/compute-get-take-indices-avx2
          fi
